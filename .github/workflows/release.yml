name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run the specs
        run: bundle exec rspec --format progress

      # Builds the gem, pushes it to RubyGems.org with a short-lived OIDC
      # token, and creates a GitHub release for the tag.
      - uses: rubygems/release-gem@v1
